<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Habits</title>
  <link rel="stylesheet" href="habits.component.css">
</head>
<body>
<header>
  <div class="logo">Habitly</div>
  <div class="button-container">
    <button class="btnAddHabit" (click)="addHabit()">Add Habit</button>
    <button class="btnAddHabit">Send Email</button>
    <button class="btnGoBack" onclick="window.location.href='/dashboard'">Back to Dashboard</button>
  </div>
</header>

<main>
  <h1>My Habits</h1>
  <p>Track your progress and habits below.</p>
  <div class="container">
  <h2 class="my-4">My Habits</h2>
  <p>Track and manage your habits below.</p>

  <div *ngIf="habits$ | async as habits; else loading">
    <app-habits-table [habits]="habits"></app-habits-table>
  </div>

  <ng-template #loading>
    <p>Loading habits...</p>
  </ng-template>

  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  </div>
</main>
</body>
</html>
