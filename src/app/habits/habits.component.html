<div class="habits">
  <header>
    <div class="logo">Habitly</div>
    <div class="button-container">
      <button class="btnAddHabit" (click)="addHabit()">Add Habit</button>
      <button class="btnAddHabit" (click)="sendEmail()">Send Email</button>
      <button class="btnGoBack" onclick="window.location.href='/dashboard'">Back to Dashboard</button>
    </div>
  </header>

  <main>
    <h1>My Habits</h1>
    <p>Track your progress and habits below.</p>

    <section class="habits-list">
      <ng-container *ngIf="habits$ | async as habits; else loading">
        <app-habits-table
          [habits]="habits"
          (habitDeleted)="onHabitDeleted()"
        ></app-habits-table>
      </ng-container>

      <ng-template #loading>
        <p>Loading habits...</p>
      </ng-template>

      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </section>
  </main>
</div>
