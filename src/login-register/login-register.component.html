<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <link rel="stylesheet" href="login-register.component.css">
</head>
<body>

<header>
  <div class="logo">Habitly</div>
  <div class="navigation">
    <button (click)="showLoginForm()">Login</button>
    <button (click)="showRegisterForm()">Register</button>
  </div>
</header>

<div class="wrapper" [ngClass]="getWrapperClass()">
  <!-- Login Form -->
  <div class="form-box login" *ngIf="isLoginVisible">
    <h2>Login</h2>
    <p>Make sure you fill in all fields.</p>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          autocomplete="email"
          placeholder="Enter your email"
        />
        <label for="email" class="form-label">Email</label>
      </div>
      <div class="mb-3">
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          autocomplete="new-password"
          placeholder="Enter your password"
        />
        <label for="password" class="form-label">Password</label>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
        Login
      </button>
    </form>
    <button (click)="loginWithGoogle()" class="btn btn-secondary mt-3">
      Login with Google
    </button>
  </div>

  <!-- Register Form -->
  <div class="form-box register" *ngIf="isRegisterVisible">
    <h2>Register</h2>
    <p>Make sure you fill in all fields.</p>
    <p>Your password should be at least 6 characters long, both letters and numbers.</p>
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <div class="mb-3">
        <input
          type="text"
          id="rUsername"
          formControlName="username"
          autocomplete="username"
          class="form-control"
          placeholder="Enter your username"
        />
        <label for="password" class="form-label">Password</label>
      </div>
      <div class="mb-3">
        <input
          type="email"
          id="rEmail"
          formControlName="email"
          autocomplete="email"
          class="form-control"
          placeholder="Enter your email"
        />
        <label for="rEmail" class="form-label">Email</label>
      </div>
      <div class="mb-3">
        <input
          type="password"
          id="rPassword"
          formControlName="password"
          autocomplete="new-password"
          class="form-control"
          placeholder="Enter your password"
        />
        <label for="rPassword" class="form-label">Password</label>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">
        Register
      </button>
    </form>
    <button (click)="loginWithGoogle()" class="btn btn-secondary mt-3">
      Register with Google
    </button>
  </div>

  <!-- Messages -->
  <div class="alert alert-info mt-3" *ngIf="message">
    {{ message }}
  </div>
</div>

</body>
</html>
